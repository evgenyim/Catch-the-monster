name: Verify and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game rules and saved progress
        run: npm test
      - name: Build static browser distribution
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: catch-the-monster-web
          path: dist/
          if-no-files-found: error

  android:
    name: Android APK
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint offline APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: catch-the-monster-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
