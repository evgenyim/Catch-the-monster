plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.user.catchthemonster'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.user.catchthemonster'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '2.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// Android packages exactly the browser sources. No generated files are committed.
tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('../web'))
    into(layout.buildDirectory.dir('generated/gameAssets/game'))
    doFirst {
        if (!rootProject.file('../web/index.html').isFile()) {
            throw new GradleException('Missing web/index.html. Check out the complete repository before building.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'syncWebAssets'
}
