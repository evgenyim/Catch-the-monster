<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5d03">
  <meta name="description" content="Catch The Monster. Исходные правила и графика: загоните монстра в ловушку. 24 уровня, сохранение и игра без сети.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Catch The Monster</title>
  <link rel="icon" href="./assets/original/monster.png" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="classic-app">
    <section id="menu-screen" class="screen menu-screen" aria-label="Главное меню">
      <h1 class="sr-only">Catch The Monster</h1>
      <img class="game-logo" src="./assets/original/ctm_title.png" alt="Catch The Monster" width="647" height="407">
      <button id="menu-play" class="classic-button menu-button menu-play">PLAY</button>
      <button id="menu-help" class="classic-button menu-button menu-help">HELP</button>
      <button id="menu-exit" class="classic-button menu-button menu-exit">EXIT</button>
      <p id="rules-update" class="rules-update" hidden>Исходные правила восстановлены: диагонали свободны, при равных путях монстр обходит яму. Твои звёзды и открытые уровни сохранены.</p>
    </section>

    <section id="levels-screen" class="screen levels-screen" aria-label="Выбор уровня" hidden>
      <h1 class="sr-only">Levels</h1>
      <img class="levels-title" src="./assets/original/level.png" alt="Levels" width="438" height="181">
      <div id="level-grid" class="level-grid"></div>
      <div class="map-footer"><button id="back-menu" class="classic-button">BACK</button><p id="total-stars" aria-live="polite"></p></div>
    </section>

    <section id="game-screen" class="screen game-screen" aria-label="Игровое поле" hidden>
      <h1 id="level-name" class="sr-only"></h1>
      <div id="level-heading" class="level-heading" aria-hidden="true"></div>
      <div class="board-frame">
        <div id="board" class="board" role="group" aria-label="Поле: нажми на клетку, чтобы поставить или убрать стену"></div>
        <div id="monster-layer" class="monster-layer" aria-hidden="true"></div>
        <img id="win-banner" class="win-banner" src="./assets/original/youwin.png" alt="YOU WIN" width="400" height="400" hidden>
      </div>
      <div class="classic-controls">
        <button id="reset" class="classic-button" aria-label="Начать уровень заново">TRY<br>AGAIN</button>
        <button id="wall-tool" class="wall-tool" aria-label="Стены" title="Нажми на свободную клетку"><span id="wall-count"></span></button>
        <button id="start" class="classic-button"><span id="start-label">START</span></button>
      </div>
      <p id="status" class="status-line" role="status" aria-live="polite"></p>
      <section id="result-summary" class="result-summary" aria-live="polite" hidden>
        <div class="result-stars" id="result-stars"></div>
        <p id="result-message"></p>
        <button id="replay" class="classic-button small-button">REPLAY</button>
      </section>
      <nav class="game-tools" aria-label="Управление игрой">
        <button id="open-map" class="classic-button small-button" aria-label="Выбор уровня">LEVELS</button>
        <button id="undo" class="classic-button small-button" aria-label="Отменить последнюю стену">UNDO</button>
        <button id="hint" class="classic-button small-button" aria-label="Подсказка">HINT</button>
        <button id="help" class="classic-button small-button" aria-label="Как играть">HELP</button>
        <button id="speed" class="classic-button small-button" aria-label="Ускорить анимацию">1×</button>
        <button id="sound" class="classic-button small-button" aria-label="Выключить звук">SOUND</button>
      </nav>
      <p id="hint-text" class="hint-text" hidden></p>
      <button id="game-menu" class="text-button">MENU</button>
      <p id="save-status" class="save-status"></p>
    </section>

    <section id="exit-screen" class="screen exit-screen" hidden>
      <img src="./assets/original/ctm_title.png" alt="Catch The Monster" width="647" height="407">
      <p>Игра остановлена. Прогресс сохранён.<br>Эту вкладку можно закрыть.</p>
      <button id="return-menu" class="classic-button">PLAY</button>
    </section>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><button id="close-modal" class="classic-button modal-close" aria-label="Закрыть">×</button><div id="modal-content"></div></dialog>
</body>
</html>
